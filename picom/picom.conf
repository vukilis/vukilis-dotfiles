# Enable Blur
blur: {
  method = "dual_kawase";
  strength = 7;
  background = true;
  background-fixed = false;
};

# Performance fixes for gaming and notifications
backend = "glx";
vsync = true;
use-damage = false;
unredir-if-possible = false;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.4;

# fading = true;
# fade-in-step = 0.03;
# fade-out-step = 0.03;
# fade-delta = 5;

# mark-wmwin-focused = true;
# mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;
log-level = "warn";

# Unified Window Rules
rules = (
  # Opacity Rules
  { match = "class_g = 'virt-manager' || class_g = 'kitty'";
    opacity = 1.0; },
  { match = "class_g = 'st-256color' || class_g = 'Thunar' || class_g = 'Polybar'";
    opacity = 0.90; },
  { match = "class_g = 'dwm'";
    opacity = 0.95; },

  # Blur Exclusions
  { match = "window_type = 'notification' || class_g = 'Dunst' || class_g = 'flameshot' || class_g = 'steam' || class_g = 'discord' || _GTK_FRAME_EXTENTS@";
    blur-background = false; },

  # Shadow Exclusions
  { match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd' || class_g = 'Cairo-clock' || class_g = 'discord' || class_g = 'flameshot' || _GTK_FRAME_EXTENTS@";
    shadow = false; },

  # Window Types
  { match = "window_type = 'tooltip'";
    fade = true;
    shadow = true;
    opacity = 0.75;
    focus = true;
    full-shadow = false; },
  { match = "window_type = 'dock'";
    shadow = false;
    blur-background = true; },
  { match = "window_type = 'dnd'";
    shadow = false; },
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    opacity = 0.90; }
);

animations = (
  {
    triggers = ["open", "show"];
    opacity = {
      curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
      duration = 0.40;
      start = 0;
      end = "window-raw-opacity";
    };
    scale-x = {
      curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
      duration = 0.40;
      start = 0.92;
      end = 1.0;
    };
    scale-y = {
      curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
      duration = 0.40;
      start = 0.92;
      end = 1.0;
    };
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["close", "hide"];
    opacity = {
      curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
      duration = 0.12;
      start = "window-raw-opacity-before";
      end = 0;
    };
    scale-x = {
      curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
      duration = 0.12;
      start = 1.0;
      end = 0.92;
    };
    scale-y = {
      curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
      duration = 0.12;
      start = 1.0;
      end = 0.92;
    };
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    triggers = ["geometry"];
    scale-x = {
      curve = "cubic-bezier(0.25, 1, 0.5, 1)";
      duration = 0.22;
      start = 0.96;
      end = 1.0;
    };
    scale-y = {
      curve = "cubic-bezier(0.25, 1, 0.5, 1)";
      duration = 0.22;
      start = 0.96;
      end = 1.0;
    };
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
)