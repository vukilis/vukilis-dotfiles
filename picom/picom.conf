# Enable Blur
blur: {
  method = "dual_kawase";
  strength = 7;
  background = true;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'notification'",
  "class_g = 'Dunst'",
  "class_g = 'flameshot'",
  "class_g = 'steam'",
  "_GTK_FRAME_EXTENTS@"
];

# Performance fixes for gaming and notifications
backend = "glx";
vsync = true;
use-damage = false;
unredir-if-possible = true;
unredir-if-possible-exclude = [
  "class_g = 'Firefox'",
  "class_g = 'Google-chrome'"
];

# Force transparency on specific types of windows
opacity-rule = [
  "100:class_g = 'virt-manager'",
  "90:class_g = 'st-256color'",
  "90:class_g = 'Thunar'",
  "100:class_g = 'kitty'",
  "90:class_g = 'Polybar'",
  "95:class_g = 'dwm'"
];

shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.4;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@"
];

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; blur-background = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.9; }
  dropdown_menu = { opacity = 0.9; }
};